name: "Release"

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = `v${{ steps.get-version.outputs.version }}`;

            // Check if a release with this tag already exists
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              // If it exists and is a draft, reuse it
              if (existing.draft) {
                console.log(`Reusing existing draft release ${existing.id} for tag ${tagName}`);
                return existing.id;
              }
              // If it exists and is published, fail
              throw new Error(`Release ${tagName} already exists and is published. Bump the version first.`);
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // Create new draft release
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: tagName,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  read-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: echo "matrix=$(cat .github/workflows/build-matrix.json | jq -c .)" >> "$GITHUB_OUTPUT"

  publish-tauri:
    permissions:
      contents: write
    needs: [create-release, read-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.read-matrix.outputs.matrix) }}

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "meetdy"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit
