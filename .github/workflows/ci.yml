name: "CI"

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install

      - name: ESLint
        run: bun run lint

      - name: Prettier
        run: bun run format:check

      - name: Frontend build & typecheck
        run: bun run build

      - name: i18n key completeness
        run: node scripts/i18n-sync.mjs --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  test:
    name: Test (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache VAD model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models/silero_vad_v4.onnx
          key: vad-model-onnx-v4
          restore-keys: |
            vad-model-

      - name: Download VAD model (if not cached)
        run: |
          if [ ! -f src-tauri/resources/models/silero_vad_v4.onnx ]; then
            mkdir -p src-tauri/resources/models
            curl -L -o src-tauri/resources/models/silero_vad_v4.onnx https://blob.handy.computer/silero_vad_v4.onnx
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev \
            libx11-dev libxtst-dev libxrandr-dev libvulkan-dev

      - name: Install frontend dependencies
        run: bun install

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --profile ci

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit
